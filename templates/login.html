{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>🔐 Student Login</h2>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Register here</a>
    </p>

</div>

{% endblock %}
