<!DOCTYPE html>
<html>
<head>
    <title>My Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #4f46e5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #4f46e5;
            color: white;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📊 My Attendance</h2>

    {% if records %}

    <table>
        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>

        {% for record in records %}
        <tr>
            <td>{{ record["attendance_date"] }}</td>
            <td>{{ record["status"] }}</td>
        </tr>
        {% endfor %}
    </table>

    {% else %}

    <p style="text-align:center;">
        No attendance records available.
    </p>

    {% endif %}

    <a href="/dashboard" class="back-btn">← Back to Dashboard</a>

</div>

</body>
</html>
